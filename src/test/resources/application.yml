# Reemplaza por completo a src/main/resources/application.yml durante los
# tests. Ver el comentario equivalente en ms-productos-catalogo.
spring:
  datasource:
    url: jdbc:h2:mem:carritodb-test
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://example.com/.well-known/jwks.json

server:
  port: 0
